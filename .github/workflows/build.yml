name: PHP vanilla map checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PHP entry point
        run: php -l index.php
      - name: Validate browser JavaScript
        run: node --check app.js
      - name: Check required routes and assets
        run: test -f .htaccess && test -f omni.css && test -f public/uaf-logo.svg
