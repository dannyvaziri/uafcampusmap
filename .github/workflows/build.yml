name: PHP vanilla map checks

on:
  push:
    branches: [main, basemap-toggle-20260902]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PHP routes and shared includes
        run: |
          php -l index.php
          php -l accessible.php
          php -l print.php
          php -l admin/index.php
          php -l admin/images.php
          php -l admin/overlays.php
          php -l admin/publish.php
          php -l admin/footprints.php
          for file in includes/*.php; do php -l "$file"; done

      - name: Validate JSON data
        run: |
          php -r '$files = glob("data/*.json"); foreach ($files as $file) { json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); echo "valid $file\n"; }'

      - name: Validate overlay inventory and key model
        run: |
          php -r '
            $_SERVER["REQUEST_URI"] = "/admin/overlays";
            require "includes/bootstrap.php";
            if (count($buildings) !== 67) throw new RuntimeException("Expected 67 base buildings");
            if (count($parking) !== 62) throw new RuntimeException("Expected 62 base parking records");
            $index = uaf_legend_index($legend);
            if (count($index) < 10) throw new RuntimeException("Map key is unexpectedly incomplete");
            foreach ($parking as $row) {
              $key = uaf_parking_legend_key($row);
              if (!isset($index[$key])) throw new RuntimeException("Parking key mapping is missing: " . $key);
            }
            foreach (($config["shapes"] ?? []) as $shape) {
              $key = uaf_infer_legend_key($shape, $index, $parking);
              if (!isset($index[$key])) throw new RuntimeException("Shape key is missing: " . $key);
              $styled = uaf_apply_legend_style($shape, $index, $parking);
              foreach (["stroke", "fill", "weight", "opacity", "fillOpacity"] as $prop) {
                if (array_key_exists($prop, $index[$key]) && ($styled["properties"][$prop] ?? null) != $index[$key][$prop]) throw new RuntimeException("Shape style does not match key: " . $prop);
              }
              if (!empty($shape["properties"]["building_id"]) && $key !== "building") throw new RuntimeException("Building overlay is not using the Building key");
              if (!empty($shape["properties"]["parking_id"]) && !str_starts_with($key, "parking_")) throw new RuntimeException("Parking overlay is outside the parking key family");
            }
            echo "Overlay inventory/key model valid: 67 buildings, 62 parking records, " . count($index) . " key styles.\n";
          '

      - name: Syntax-check vanilla browser JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/basemap.js
          node --check assets/js/legend.js
          node --check assets/js/experience.js
          node --check assets/js/surface-fix.js
          node --check assets/js/building-reference.js
          node --check assets/js/geometry-import.js
          node --check assets/js/overlay-manager.js
          node --check assets/js/publish-proxy.js
          echo 'Vanilla browser JavaScript parses successfully; no install or build was run.'

      - name: Smoke-test PHP page rendering
        run: |
          REQUEST_URI=/ php index.php > /tmp/map.html
          REQUEST_URI=/accessible php index.php > /tmp/accessible.html
          REQUEST_URI=/admin php index.php > /tmp/admin.html
          REQUEST_URI=/admin/images php index.php > /tmp/images.html
          REQUEST_URI=/admin/overlays php index.php > /tmp/overlays.html
          REQUEST_URI=/print php index.php > /tmp/print.html
          grep -Fq 'data-page="map"' /tmp/map.html
          grep -Fq 'data-page="accessible"' /tmp/accessible.html
          grep -Fq 'data-page="admin"' /tmp/admin.html
          grep -Fq 'data-page="images"' /tmp/images.html
          grep -Fq 'data-page="overlays"' /tmp/overlays.html
          grep -Fq 'data-page="print"' /tmp/print.html
          grep -Fq 'building-reference.js' /tmp/map.html
          grep -Fq 'geometry-import.js' /tmp/overlays.html
          grep -Fq 'overlay-manager.js' /tmp/overlays.html
          grep -Fq 'overlay-import.css' /tmp/overlays.html
          grep -Fq 'publish-proxy.js' /tmp/admin.html
          grep -Fq 'publish-proxy.js' /tmp/images.html
          grep -Fq 'publish-proxy.js' /tmp/overlays.html
          grep -Fq 'leaflet.draw.js' /tmp/admin.html
          grep -Fq 'leaflet.draw.js' /tmp/overlays.html
          grep -Fq 'uaf-legend' /tmp/map.html
          grep -Fq 'jspdf' /tmp/print.html
          echo 'All PHP page shells rendered with the expected page mode and page-specific assets.'

      - name: Verify nonblocking editable footprint flow
        run: |
          grep -Fq '/admin/footprints.php' assets/js/geometry-import.js
          grep -Fq 'AbortController' assets/js/geometry-import.js
          grep -Fq 'bulkImportBuildingMatches' assets/js/geometry-import.js
          grep -Fq 'bulkImportBuildingMatches' assets/js/overlay-manager.js
          grep -Fq 'Needs review' assets/js/overlay-manager.js
          grep -Fq "f:'json'" assets/js/building-reference.js
          ! grep -Fq "f:'geojson'" assets/js/building-reference.js
          grep -Fq "'f' => 'json'" admin/footprints.php
          grep -Fq 'CURLOPT_TIMEOUT' admin/footprints.php
          echo 'Building import is bounded, bulk-applied, editable, and uses the source supported JSON format.'

      - name: Check secure publishing path
        run: |
          test -f admin/publish.php
          grep -Fq "getenv('UAF_GITHUB_TOKEN')" admin/publish.php
          grep -Fq "uaf-map-secrets.php" admin/publish.php
          grep -Fq "REMOTE_USER" admin/publish.php
          grep -Fq "?ref=" admin/publish.php
          grep -Fq "current['sha']" admin/publish.php
          grep -Fq "/admin/publish.php" assets/js/publish-proxy.js
          ! grep -qE 'github_pat_|ghp_|api.github.com/repos/.*/contents' assets/js/overlay-manager.js assets/js/geometry-import.js assets/js/publish-proxy.js
          echo 'Server-side publishing is protected, fetches the current SHA, and contains no embedded browser-side GitHub credential.'

      - name: Check OMNI runtime structure
        run: |
          set -e
          test -f .htaccess
          test -f index.php
          test -f accessible.php
          test -f print.php
          test -f admin/index.php
          test -f admin/images.php
          test -f admin/overlays.php
          test -f admin/publish.php
          test -f admin/footprints.php
          test -f includes/bootstrap.php
          test -f includes/header.php
          test -f includes/footer.php
          test -f assets/css/omni.css
          test -f assets/css/overlays.css
          test -f assets/css/overlay-import.css
          test -f assets/css/basemap.css
          test -f assets/js/app.js
          test -f assets/js/basemap.js
          test -f assets/js/legend.js
          test -f assets/js/building-reference.js
          test -f assets/js/geometry-import.js
          test -f assets/js/overlay-manager.js
          test -f assets/js/publish-proxy.js
          test -f assets/images/uaf-logo.svg
          test -f data/map-config.json
          test -f data/legend.json
          grep -Fq 'Save PDF' assets/js/app.js
          grep -Fq 'window.print()' assets/js/app.js
          grep -Fq 'Map overlays & key' assets/js/overlay-manager.js
          grep -Fq 'parking_visitor_metered' data/legend.json
          grep -Fq 'Satellite</button>' assets/js/basemap.js
          grep -Fq "mode: 'map'" assets/js/basemap.js
          grep -q '^RewriteRule \^admin/overlays' .htaccess
          echo 'OMNI/PHP runtime structure is present.'

      - name: Confirm runtime has no compiled-app entry point
        run: |
          ! grep -qE 'src="/src/|react-dom|createRoot|/@vite|npm run|npm install' index.php includes/*.php assets/js/*.js
          echo 'No React/Vite/npm runtime entry point is referenced.'
