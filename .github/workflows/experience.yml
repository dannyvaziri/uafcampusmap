name: Public map experience checks

on:
  push:
    branches: [main, widener-redesign-20260902]
  pull_request:
    branches: [main]

jobs:
  experience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP and JSON
        run: |
          php -l index.php
          php -l includes/header.php
          php -l includes/footer.php
          php -l includes/bootstrap.php
          php -l admin/footprints.php
          php -r '$files = glob("data/*.json"); foreach ($files as $file) { json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); echo "valid $file\n"; }'

      - name: Validate vanilla JavaScript
        run: |
          node --check assets/js/experience.js
          node --check assets/js/basemap.js
          node --check assets/js/surface-fix.js
          node --check assets/js/building-reference.js
          node --check assets/js/geometry-import.js
          node --check assets/js/overlay-manager.js
          node --check assets/js/app.js
          echo 'Public/admin runtime JavaScript parses without a build step.'

      - name: Verify map-first page shell
        run: |
          REQUEST_URI=/ php index.php > /tmp/map.html
          REQUEST_URI=/admin/overlays php admin/overlays.php > /tmp/overlays.html
          grep -Fq 'data-page="map"' /tmp/map.html
          grep -Fq 'assets/css/experience.css' /tmp/map.html
          grep -Fq 'assets/css/map-color.css' /tmp/map.html
          grep -Fq 'assets/css/live-fixes.css' /tmp/map.html
          grep -Fq 'assets/css/map-polish.css' /tmp/map.html
          grep -Fq 'assets/js/experience.js' /tmp/map.html
          grep -Fq 'assets/js/surface-fix.js' /tmp/map.html
          grep -Fq 'assets/js/building-reference.js' /tmp/map.html
          grep -Fq 'assets/js/geometry-import.js' /tmp/overlays.html
          grep -Fq 'assets/js/overlay-manager.js' /tmp/overlays.html
          grep -Fq 'assets/css/overlay-import.css' /tmp/overlays.html
          grep -Fq 'data-map-command="locations"' /tmp/map.html
          grep -Fq 'data-map-command="layers"' /tmp/map.html
          grep -Fq 'data-map-command="layer:Parking"' /tmp/map.html
          grep -Fq 'Printable Map' /tmp/map.html
          grep -Fq 'Office of Admissions' /tmp/map.html
          grep -Fq 'Financial Aid Office' /tmp/map.html
          echo 'Map-first UAF shell, public building reference, stable overlay importer and searchable location enrichment are present.'

      - name: Verify designed map and screenshot fixes
        run: |
          grep -Fq 'World_Topo_Map' assets/js/basemap.js
          grep -Fq 'tile.openstreetmap.org' assets/js/basemap.js
          grep -Fq 'tileerror' assets/js/basemap.js
          grep -Fq 'Satellite</button>' assets/js/basemap.js
          grep -Fq "mode: 'map'" assets/js/basemap.js
          grep -Fq 'filter:none!important' assets/css/map-color.css
          grep -Fq 'filter:none!important' assets/css/live-fixes.css
          grep -Fq 'filter:none!important' assets/css/map-polish.css
          grep -Fq "kind === 'parking-area'" assets/js/surface-fix.js
          grep -Fq "kind === 'building-footprint'" assets/js/surface-fix.js
          grep -Fq "fillColor:'#aeb8bd'" assets/js/surface-fix.js
          grep -Fq 'uaf-building-shadow' assets/js/experience.js
          grep -Fq 'uaf-building-roof' assets/js/experience.js
          grep -Fq 'uaf-layer-highlight' assets/js/experience.js
          grep -Fq 'uaf-browser-drawer' assets/js/experience.js
          grep -Fq 'location' assets/js/experience.js
          grep -Fq 'layers' assets/js/experience.js
          grep -Fq 'basemap' assets/js/experience.js
          grep -Fq 'prefers-reduced-motion' assets/css/experience.css
          grep -Fq '@media print' assets/css/experience.css
          echo 'Topographic Map/Satellite, neutral parking surfaces, dimensional buildings, URL state, reduced motion and print rules are present.'

      - name: Verify complete and editable building geometry flow
        run: |
          grep -Fq 'Building_Outlines_2023_Pictometry' assets/js/building-reference.js
          grep -Fq 'FeatureServer/22/query' assets/js/building-reference.js
          grep -Fq 'uaf-building-reference' assets/js/building-reference.js
          grep -Fq "f:'json'" assets/js/building-reference.js
          ! grep -Fq "f:'geojson'" assets/js/building-reference.js
          grep -Fq '/admin/footprints.php' assets/js/geometry-import.js
          grep -Fq 'AbortController' assets/js/geometry-import.js
          grep -Fq 'bulkImportBuildingMatches' assets/js/geometry-import.js
          grep -Fq 'bulkImportBuildingMatches' assets/js/overlay-manager.js
          grep -Fq 'review_status' assets/js/overlay-manager.js
          grep -Fq 'Needs review' assets/js/overlay-manager.js
          grep -Fq 'candidate.distance <= 45' assets/js/geometry-import.js
          grep -Fq "'f' => 'json'" admin/footprints.php
          echo 'FNSB vector footprints render publicly and can be bulk-imported as editable, review-required UAF draft geometry without blocking page load.'

      - name: Verify secure publish UI
        run: |
          grep -Fq 'Publish changes' assets/js/overlay-manager.js
          grep -Fq '/admin/publish.php' assets/js/publish-proxy.js
          ! grep -qE 'github_pat_|ghp_|api.github.com/repos/.*/contents|overlay-github-token' assets/js/overlay-manager.js assets/js/geometry-import.js
          echo 'Overlay publishing remains server-side and no browser GitHub token field is present.'

      - name: Verify data-driven modes and search
        run: |
          php -r '$x=json_decode(file_get_contents("data/location-content.json"),true,512,JSON_THROW_ON_ERROR); if (!in_array("Admissions", $x["locations"]["signers"]["aliases"], true)) throw new RuntimeException("Admissions alias missing"); if (!in_array("Financial Aid", $x["locations"]["eielson"]["aliases"], true)) throw new RuntimeException("Financial Aid alias missing");'
          php -r '$x=json_decode(file_get_contents("data/modes.json"),true,512,JSON_THROW_ON_ERROR); foreach (["standard","visitor","parking","accessibility","construction","winter"] as $id) if (!isset($x["modes"][$id])) throw new RuntimeException("Mode missing: $id");'
          ! grep -qE 'react-dom|createRoot|/@vite|npm run|npm install' index.php includes/*.php assets/js/experience.js assets/js/building-reference.js assets/js/geometry-import.js assets/js/overlay-manager.js
          echo 'Search enrichment, building geometry and reusable modes are data-driven with no React/Vite/npm runtime.'
